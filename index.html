    <script>
      // Safe HMR WebSocket guard for Vite dev environment
      (function() {
        if (typeof window !== 'undefined') {
          // Suppress unhandled WebSocket error events from @vite/client
          window.addEventListener('error', function(e) {
            if (e && (
              (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) ||
              (e.filename && e.filename.indexOf('@vite/client') !== -1)
            )) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var reason = e && e.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);

          // Wrap WebSocket constructor for vite-hmr to avoid connection close errors
          var OriginalWS = window.WebSocket;
          if (OriginalWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('vite') !== -1)) {
                var dummyListeners = {};
                return {
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  readyState: 3, // CLOSED
                  url: url,
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, listener) {
                    dummyListeners[type] = listener;
                  },
                  removeEventListener: function(type) {
                    delete dummyListeners[type];
                  },
                  dispatchEvent: function() { return false; },
                };
              }
              return new OriginalWS(url, protocols);
            };
            window.WebSocket.prototype = OriginalWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>
